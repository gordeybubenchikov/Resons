<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Вход в Ресонс</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #fff; padding: 40px 20px; border-radius: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center; width: 100%; max-width: 350px; position: relative; }
    .status-box { margin-bottom: 20px; padding: 15px; border-radius: 12px; background: #f0faf1; color: #2DC653; font-weight: 800; font-size: 18px; word-break: break-word; }
    .status-box.guest { background: #f5f5f5; color: #888; }
    .btn { border: none; padding: 15px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; transition: 0.2s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn:active { transform: scale(0.97); }
    .btn-yandex { background: #FC3F1D; color: #fff; box-shadow: 0 4px 15px rgba(252, 63, 29, 0.2); }
    .btn-logout { background: #f0f0f0; color: #e05555; margin-top: 10px; display: none; }
    .version-tag { position: absolute; bottom: 10px; left: 0; right: 0; font-size: 11px; color: #ccc; font-weight: bold; }
    
    /* Красная плашка для ошибок */
    #debug-box { display: none; background: #ffe5e5; color: #cc0000; padding: 10px; border-radius: 10px; margin-top: 15px; font-size: 12px; word-break: break-all; text-align: left; border: 1px solid #ff9999; }
</style>
</head>
<body>

    <div class="card">
        <div id="status" class="status-box guest">Загрузка...</div>
        
        <button class="btn btn-yandex" id="login-btn" onclick="loginYandex()" style="display:none;">
            Войти через Яндекс
        </button>
        
        <button class="btn btn-logout" id="logout-btn" onclick="doLogout()">Выйти</button>

        <!-- Сюда будет выводиться причина ошибки -->
        <div id="debug-box"></div>

        <div class="version-tag">Версия 3.0 (Детектив)</div>
    </div>

<script>
    const SB = 'https://owfnqdqpzcmkblgdrafk.supabase.co';
    const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Zm5xZHFwemNta2JsZ2RyYWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODc2NDEsImV4cCI6MjEwNzI2MzY0MX0.LloyseM1xpp-APLp5uvYeUbFkqW-Psm0R9LLuRPgX00';
    const MY_URL = 'https://gordeybubenchikov.github.io/Resons/TestYandex.html';

    // ДЕТЕКТИВ: Проверяем, есть ли в адресе ошибка от Яндекса
    const urlHash = window.location.hash;
    const debugBox = document.getElementById('debug-box');

    if (urlHash && urlHash.includes('error')) {
        debugBox.style.display = 'block';
        // Показываем ошибку на экране
        debugBox.innerText = decodeURIComponent(urlHash);
    }

    const sb = supabase.createClient(SB, SK, {
        auth: {
            flowType: 'implicit',
            detectSessionInUrl: true,
            persistSession: true
        }
    });

    function updateUI(session) {
        const status = document.getElementById('status');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');

        if (session) {
            const user = session.user;
            const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'Пользователь';
            
            status.textContent = 'Привет, ' + name + '!';
            status.classList.remove('guest');
            loginBtn.style.display = 'none';
            logoutBtn.style.display = 'flex';
            debugBox.style.display = 'none'; // Прячем ошибку, если вошли
        } else {
            status.textContent = 'Вы не вошли';
            status.classList.add('guest');
            loginBtn.style.display = 'flex';
            logoutBtn.style.display = 'none';
        }
    }

    sb.auth.onAuthStateChange((event, session) => {
        console.log('Событие:', event);
        if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
            updateUI(session);
            if (window.location.hash.includes('access_token')) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        } else if (event === 'USER_UPDATED') {
            updateUI(session);
        }
    });

    sb.auth.getSession().then(({ data }) => {
        updateUI(data.session);
        
        // Если сессии нет и ошибки нет, значит мы просто зашли на сайт
        if(!data.session) {
            document.getElementById('login-btn').style.display = 'flex';
        }
    });

    async function loginYandex() {
        const { error } = await sb.auth.signInWithOAuth({
            provider: 'custom:yandex',
            options: { redirectTo: MY_URL }
        });
        if(error) alert('Ошибка при запросе: ' + error.message);
    }

    async function doLogout() {
        await sb.auth.signOut();
        window.location.reload();
    }
</script>
</body>
</html>
