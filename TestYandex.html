<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тест входа Ресонс</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f6fbe9; margin: 0; padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #22301a; }
    .card { background: #fff; padding: 40px 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 350px; }
    .status-box { margin-bottom: 20px; padding: 15px; border-radius: 12px; background: #f0faf1; color: #2DC653; font-weight: 800; font-size: 18px; word-break: break-all; }
    .status-box.guest { background: #f5f5f5; color: #888; }
    .btn { border: none; padding: 15px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; transition: 0.2s; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn:active { transform: scale(0.97); }
    .btn-yandex { background: #FC3F1D; color: #fff; box-shadow: 0 4px 15px rgba(252, 63, 29, 0.2); }
    .btn-logout { background: #f0f0f0; color: #e05555; margin-top: 10px; display: none; }
</style>
</head>
<body>

    <div class="card">
        <div id="status" class="status-box guest">Вы не вошли</div>
        
        <button class="btn btn-yandex" id="login-btn" onclick="loginYandex()">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.16 1.19c-4.87 0-7.63 2.88-7.63 6.51 0 2.68 1.42 4.41 3.65 5.31l-3.65 7.32h3.08l3.2-6.64h2.35v6.64h2.8V1.69c-.53-.19-1.42-.5-3.8-.5zm-1.02 10.19c-1.57-.27-2.58-1.31-2.58-3.41 0-2.47 1.42-3.65 3.41-3.65.38 0 .73.04 1.03.12v7.03h-1.86z"/></svg>
            Войти через Яндекс
        </button>
        
        <button class="btn btn-logout" id="logout-btn" onclick="doLogout()">Выйти</button>
    </div>

<script>
    const SB = 'https://owfnqdqpzcmkblgdrafk.supabase.co';
    const SK = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im93Zm5xZHFwemNta2JsZ2RyYWZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2ODc2NDEsImV4cCI6MjEwNzI2MzY0MX0.LloyseM1xpp-APLp5uvYeUbFkqW-Psm0R9LLuRPgX00';
    
    const MY_URL = 'https://gordeybubenchikov.github.io/Resons/TestYandex.html';

    // ГЛАВНОЕ ИЗМЕНЕНИЕ: Используем 'implicit' вместо 'pkce'
    const sb = supabase.createClient(SB, SK, {
        auth: {
            flowType: 'implicit',
            detectSessionInUrl: true,
            persistSession: true
        }
    });

    // Если в адресе есть токены (после возврата с Яндекса), очищаем его
    if (window.location.hash.includes('access_token')) {
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    // Слушаем изменения состояния входа
    sb.auth.onAuthStateChange((event, session) => {
        console.log('Событие входа:', event); // Полезно для проверки в консоли
        
        if (session) {
            const user = session.user;
            // Яндекс передает имя в разных полях, поэтому проверяем несколько
            const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'Пользователь';
            
            document.getElementById('status').textContent = 'Вы вошли: ' + name;
            document.getElementById('status').classList.remove('guest');
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'flex';
        } else {
            document.getElementById('status').textContent = 'Вы не вошли';
            document.getElementById('status').classList.add('guest');
            document.getElementById('login-btn').style.display = 'flex';
            document.getElementById('logout-btn').style.display = 'none';
        }
    });

    // Принудительно проверяем сессию при загрузке страницы
    sb.auth.getSession().then(({data}) => {
        if(data.session) {
            document.getElementById('status').textContent = 'Вы вошли: ' + (data.session.user.user_metadata?.full_name || 'Пользователь');
            document.getElementById('status').classList.remove('guest');
            document.getElementById('login-btn').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'flex';
        }
    });

    async function loginYandex() {
        const { error } = await sb.auth.signInWithOAuth({
            provider: 'custom:yandex',
            options: { redirectTo: MY_URL }
        });
        if(error) alert('Ошибка: ' + error.message);
    }

    async function doLogout() {
        await sb.auth.signOut();
        window.location.reload();
    }
</script>
</body>
</html>
