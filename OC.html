<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>okuhleOS - Gary AI</title>
<style>
  :root {
    --bg: #f2f4f8; --bg2: #ffffff; --text: #1a1d24;
    --muted: #6b7280; --line: #e5e7eb; --accent: #7C5CFF; --accent2: #22D3EE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }

  /* --- ГЛАВНЫЙ ЭКРАН --- */
  #desktop { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, #e0e7ff 0%, #f2f4f8 70%); }
  
  .app { display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; transition: transform 0.1s; }
  .app:active { transform: scale(0.9); }
  .app-icon { width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 20px rgba(124, 92, 255, 0.3); }
  .app span { font-size: 14px; font-weight: bold; color: var(--text); }

  /* --- ОКНО ГЭРИ --- */
  #gary-app { position: absolute; inset: 0; background: var(--bg); z-index: 100; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s; }
  #gary-app.open { transform: translateY(0); }
  .app-header { padding: 15px 20px; display: flex; align-items: center; border-bottom: 1px solid var(--line); font-size: 18px; font-weight: bold; background: var(--bg2); }
  .back { background: none; border: none; color: var(--text); font-size: 24px; margin-right: 15px; cursor: pointer; }
  
  .ai-chat-container { display: flex; flex-direction: column; height: 100%; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  
  .ai-msg { display: flex; align-items: flex-start; margin-bottom: 15px; }
  .ai-msg.me { flex-direction: row-reverse; }
  .ai-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #7C5CFF, #22D3EE); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; margin: 0 10px; flex-shrink: 0; }
  .ai-bubble { background: var(--bg2); padding: 12px 16px; border-radius: 16px; max-width: 80%; font-size: 14px; line-height: 1.5; border: 1px solid var(--line); }
  .ai-msg.me .ai-bubble { background: var(--accent); color: #fff; border: none; border-bottom-right-radius: 4px; }
  .ai-msg.them .ai-bubble { border-bottom-left-radius: 4px; }
  
  .chat-input-area { display: flex; gap: 10px; padding: 15px; background: var(--bg2); border-top: 1px solid var(--line); }
  .chat-input-area input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--bg); outline: none; color: var(--text); }
  .chat-input-area button { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>

  <!-- ГЛАВНЫЙ ЭКРАН -->
  <div id="desktop">
    <div class="app" onclick="openApp()">
      <div class="app-icon">
        <span style="color: #fff; font-weight: bold; font-size: 28px;">AI</span>
      </div>
      <span>Gary AI</span>
    </div>
  </div>

  <!-- ОКНО: ГЭРИ AI -->
  <div id="gary-app">
    <div class="app-header">
      <button class="back" onclick="closeApp()">←</button> 
      <div style="display: flex; align-items: center;">
        <div class="ai-avatar" style="margin-left: 0; margin-right: 10px;">AI</div> Гэри
      </div>
    </div>
    
    <div class="ai-chat-container">
      <div class="chat-messages" id="ai-messages">
        <div class="ai-msg them">
          <div class="ai-avatar">AI</div>
          <div class="ai-bubble">Привет! Я Гэри. Я на связи и готов ответить на твои вопросы. О чем поговорим?</div>
        </div>
      </div>
      <div class="chat-input-area">
        <input type="text" id="ai-input" placeholder="Напиши Гэри..." onkeypress="if(event.key === 'Enter') askGary()">
        <button onclick="askGary()">➤</button>
      </div>
    </div>
  </div>

<script>
  // Твой токен
  const HF_TOKEN = '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';
  
  // НОВЫЙ АДРЕС СЕРВЕРА HUGGING FACE
  const API_URL = "https://router.huggingface.co/v1/chat/completions";
  
  // Модель, которую будем использовать (она доступна на новом сервере)
  const MODEL_ID = "HuggingFaceH4/zephyr-7b-beta";

  function openApp() { document.getElementById('gary-app').classList.add('open'); }
  function closeApp() { document.getElementById('gary-app').classList.remove('open'); }

  function addAiMessage(text, type) {
    const box = document.getElementById('ai-messages');
    const div = document.createElement('div');
    div.className = 'ai-msg ' + type;
    let avatarHtml = (type === 'them') ? '<div class="ai-avatar">AI</div>' : '';
    div.innerHTML = `${avatarHtml}<div class="ai-bubble">${text}</div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
  }

  async function askGary() {
    const input = document.getElementById('ai-input');
    const text = input.value.trim();
    if(!text) return;
    
    addAiMessage(text, 'me');
    input.value = '';
    
    const loadingMsg = addAiMessage('Думает...', 'them');
    
    try {
      // Запрос к НОВОМУ серверу Hugging Face (OpenAI-совместимый формат)
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
           "Content-Type": "application/json",
           "Authorization": "Bearer " + HF_TOKEN
        },
        body: JSON.stringify({
          model: MODEL_ID,
          messages: [
            { role: "system", content: "Ты — полезный ИИ-ассистент по имени Гэри. Отвечай кратко и по делу на русском языке." },
            { role: "user", content: text }
          ],
          max_tokens: 500
        })
      });
      
      if (!response.ok) {
        const errText = await response.text();
        throw new Error("Ошибка сервера: " + response.status + " " + errText);
      }
      
      const data = await response.json();
      // В новом формате ответ лежит в data.choices[0].message.content
      let reply = data.choices?.[0]?.message?.content || "Извини, я не могу ответить.";
      
      loadingMsg.querySelector('.ai-bubble').innerText = reply.trim();
      
    } catch (err) {
      // Если API не сработал, показываем заглушку
      setTimeout(() => {
        let fallbackReply = "Я Гэри. Кажется, у меня проблемы с подключением к серверу. Но я всегда готов поболтать.";
        if (text.toLowerCase().includes('привет')) fallbackReply = "Привет! Рад тебя видеть. Я Гэри, твой ИИ.";
        if (text.toLowerCase().includes('как дела')) fallbackReply = "У меня всё отлично! А у тебя?";
        if (text.toLowerCase().includes('кто ты')) fallbackReply = "Я Гэри — встроенный искусственный интеллект твоей операционной системы.";
        
        loadingMsg.querySelector('.ai-bubble').innerText = fallbackReply;
      }, 1500);
    }
  }
</script>
</body>
</html>
